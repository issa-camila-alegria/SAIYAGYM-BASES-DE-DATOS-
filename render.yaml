# Blueprint de Render (https://render.com): crea el servicio web desde este repositorio.
services:
  - type: web
    name: saiyagym
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SAIYA_PRODUCCION
        value: "1"
      - key: SAIYA_SECRET_KEY
        generateValue: true
      - key: SAIYA_ORACLE_USER
        value: saiya_app
      - key: SAIYA_ORACLE_PASSWORD
        sync: false          # se escribe en el panel de Render (no se guarda en el repositorio)
      - key: SAIYA_ORACLE_DSN
        sync: false          # nombre del servicio, p. ej. saiyagymdb_high
      - key: SAIYA_ORACLE_SCHEMA
        value: SAIYAGYM
      - key: SAIYA_ORACLE_CONFIG_DIR
        value: /etc/secrets
      - key: SAIYA_ORACLE_WALLET_DIR
        value: /etc/secrets
      - key: SAIYA_ORACLE_WALLET_PASSWORD
        sync: false
